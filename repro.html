<!doctype html>
<html>
<head><meta charset="utf-8"><title>wasm hang repro</title></head>
<body>
<pre id="out">repro ready</pre>
<script type="module">
// Dev-only repro harness: drives the same custom-worker wasm pipeline as the
// app with a matrix of ffmpeg args, logging progress to the console (which the
// puppeteer driver collects). Fetches the test asset via vite's /@fs/ route.
import { spawnCoreWorker } from '/src/executor/wasm.ts'

const out = document.getElementById('out')
const log = (...a) => {
  const line = a.map(String).join(' ')
  out.textContent += '\n' + line
  console.log('[repro]', line)
}

const sleep = (ms) => new Promise((r) => setTimeout(r, ms))

async function runVariant(name, args, inputBytes, timeoutMs = 120000) {
  log(`=== variant ${name} ===`)
  const worker = await spawnCoreWorker()
  try {
    const copy = inputBytes.slice()
    await worker.call('write', { path: 'in.mp4', data: copy }, [copy.buffer])
    let lastFrame = ''
    worker.setHandlers({
      onLog: (m) => {
        if (/\bframe=/.test(m)) lastFrame = m.trim()
        else if (!/^\s*Stream|^\s*Metadata|^\s*Duration|^\s*major|^\s*minor|^\s*compatible|^\s*creation|^\s*encoder|^\s*handler|^\s*vendor/.test(m)) log('  ffmpeg:', m.trim().slice(0, 200))
      },
    })
    const t0 = performance.now()
    const result = await Promise.race([
      worker.call('exec', { args }),
      sleep(timeoutMs).then(() => ({ timeout: true })),
    ])
    const dt = ((performance.now() - t0) / 1000).toFixed(1)
    if (result.timeout) {
      log(`RESULT ${name}: HUNG after ${dt}s (last stats: ${lastFrame || 'none'})`)
    } else {
      log(`RESULT ${name}: exit=${result.code} in ${dt}s (last stats: ${lastFrame || 'none'})`)
      const outFile = args[args.length - 1]
      if (result.code === 0 && outFile !== '-') {
        const r = await worker.call('read', { path: outFile })
        log(`  output size: ${r.data.length} bytes`)
      }
    }
    return !result.timeout && result.code === 0
  } finally {
    worker.terminate()
  }
}

async function main() {
  log('loading test asset…')
  const inputBytes = new Uint8Array(
    await fetch('/@fs/D:/Projects/ffmpeg-webui/repro/in.mp4').then((r) => r.arrayBuffer()),
  )
  log(`asset: ${inputBytes.length} bytes`)

  const base = ['-t', '3', '-i', 'in.mp4', '-filter_complex', '[0:v]scale=960:-2[v]', '-map', '[v]']
  const baseFt1 = ['-t', '3', '-i', 'in.mp4', '-filter_complex_threads', '1', '-filter_complex', '[0:v]scale=960:-2[v]', '-map', '[v]']
  const enc = (extra) => [...extra, 'out.mp4']

  const variants = [
    // encoder only, simple (auto) filtergraph single-threaded
    ['lavfi-x264-ft1', ['-f', 'lavfi', '-i', 'testsrc=duration=2:size=320x240:rate=15', '-filter_threads', '1', '-c:v', 'libx264', 'out.mp4']],
    // decode + x264, no filter_complex, simple graph single-threaded
    ['x264-nofilter-ft1', ['-t', '3', '-i', 'in.mp4', '-map', '0:v', '-filter_threads', '1', '-c:v', 'libx264', '-crf', '23', 'out.mp4']],
    // the app's real command + filter_complex_threads 1 (x264 still default threads)
    ['fullfix-medium', [...baseFt1, ...enc(['-c:v', 'libx264', '-crf', '18', '-preset', 'medium'])]],
    ['fullfix-ultrafast', [...baseFt1, ...enc(['-c:v', 'libx264', '-crf', '28', '-preset', 'ultrafast'])]],
  ]

  const summary = []
  for (const [name, args] of variants) {
    const ok = await runVariant(name, args, inputBytes, name === 'copy-no-filter' ? 30000 : 120000)
    summary.push(`${ok ? 'PASS' : 'FAIL/HANG'} ${name}`)
  }
  log('=== SUMMARY ===')
  for (const s of summary) log(s)
  log('REPRO DONE')
}

main().catch((e) => { log('FATAL', e.message); console.log('[repro] REPRO DONE') })
</script>
</body>
</html>
